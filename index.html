<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
* { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button, .tab, .staff-chip, .mode-btn, .btn-load, .btn-submit, .add-btn {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
}
</style>
<title>萊萊蔥抓餅｜每日營運記錄</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root {
    --red: #E8680A;
    --red-light: #fff4ec;
    --orange: #FF9A3C;
    --gold: #D4780A;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --border: #eeddc8;
    --bg: #fffaf5;
    --white: #ffffff;
    --green: #2d7d46;
    --green-light: #edfaf2;
    --warn: #c0460a;
    --warn-light: #fff0e8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--red);
    color: white;
    padding: 16px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(232,104,10,.35);
  }
  .header-title { font-size: 18px; font-weight: 900; letter-spacing: .5px; }
  .header-sub { font-size: 11px; opacity: .8; margin-top: 2px; }
  .header-date { font-size: 13px; font-weight: 700; text-align: right; }

  /* ── TABS ── */
  .tabs {
    display: flex;
    background: white;
    border-bottom: 2px solid var(--border);
    position: sticky;
    top: 64px;
    z-index: 99;
  }
  .tab {
    flex: 1;
    padding: 12px 4px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all .2s;
  }
  .tab.active { color: var(--red); border-bottom-color: var(--red); }

  /* ── SECTIONS ── */
  .section { display: none; padding: 16px; }
  .section.active { display: block; }

  /* ── CARD ── */
  .card {
    background: white;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 14px;
    overflow: hidden;
  }
  .card-header {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: .5px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .card-header.red { background: var(--red); color: white; }
  .card-header.green { background: var(--green); color: white; }
  .card-header.gold { background: var(--gold); color: white; }
  .card-header.orange { background: var(--orange); color: white; }
  .card-header.mgmt { background: #5a6a7a; color: white; }

  /* ── DATE SELECTOR ── */
  .date-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    background: white;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .date-bar label { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }
  .date-bar input[type=date] {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .btn-load {
    background: var(--red);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }

  /* ── EXPENSE TABLE ── */
  .expense-table { width: 100%; border-collapse: collapse; }
  .expense-table th {
    background: #f5f0ea;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    padding: 8px 10px;
    text-align: left;
    letter-spacing: .3px;
  }
  .expense-table td {
    padding: 9px 10px;
    font-size: 13px;
    border-bottom: 1px solid #f0ebe4;
    vertical-align: middle;
  }
  .expense-table tr:last-child td { border-bottom: none; }
  .expense-table .amt { font-weight: 700; text-align: right; font-size: 14px; }
  .expense-table .warn-badge {
    display: inline-block;
    background: var(--warn-light);
    color: var(--warn);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 4px;
    margin-left: 4px;
  }
  .expense-table .note { font-size: 11px; color: var(--warn); display: block; margin-top: 2px; }
  .total-row td {
    background: var(--red-light);
    font-weight: 900;
    font-size: 15px;
    color: var(--red);
    border-top: 2px solid var(--red) !important;
  }

  /* ── PERFORMANCE ── */
  .perf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .perf-cell { padding: 14px 16px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .perf-cell:nth-child(2n) { border-right: none; }
  .perf-cell:nth-last-child(-n+2) { border-bottom: none; }
  .perf-label { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .perf-value { font-size: 22px; font-weight: 900; color: var(--ink); }
  .perf-value.green { color: var(--green); }
  .perf-value.red { color: var(--red); }
  .perf-unit { font-size: 12px; color: var(--muted); margin-left: 2px; }

  /* ── STAFF TABLE ── */
  .staff-table { width: 100%; border-collapse: collapse; }
  .staff-table th {
    background: #f5f0ea;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    padding: 8px 10px;
    text-align: left;
  }
  .staff-table td {
    padding: 9px 10px;
    font-size: 13px;
    border-bottom: 1px solid #f0ebe4;
  }
  .staff-table tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
  }
  .badge-work { background: var(--green-light); color: var(--green); }
  .badge-leave { background: #ffeaea; color: var(--red); }
  .badge-absent { background: #f5f5f5; color: #999; }
  .hours-badge {
    font-size: 12px;
    font-weight: 700;
    color: var(--orange);
    background: #fff7ec;
    padding: 2px 7px;
    border-radius: 20px;
  }

  /* ── ADD FORM ── */
  .add-btn {
    width: 100%;
    padding: 12px;
    background: white;
    border: 2px dashed var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    margin-bottom: 14px;
    font-weight: 700;
    transition: all .2s;
  }
  .add-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 200;
    padding: 20px;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 16px 16px 0 0;
    padding: 20px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .modal-title {
    font-size: 16px;
    font-weight: 900;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-close { font-size: 20px; cursor: pointer; color: var(--muted); }

  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: block; }
  .form-input, .form-select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  .form-input:focus, .form-select:focus { border-color: var(--red); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn-submit {
    width: 100%;
    padding: 14px;
    background: var(--red);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 900;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
  }
  . {
    background: var(--warn);
  }

  /* ── PENDING REVIEW ── */
  .pending-item {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .pending-item:last-child { border-bottom: none; }
  .pending-info { flex: 1; }
  .pending-who { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .pending-content { font-size: 13px; font-weight: 700; }
  .pending-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-approve {
    background: var(--green);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-reject {
    background: #f5f5f5;
    color: var(--muted);
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  /* ── REPORT ── */
  .report-card {
    background: white;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 14px;
    overflow: hidden;
  }
  .report-header {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 900;
    background: var(--ink);
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .report-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 16px;
    font-size: 13px;
    border-bottom: 1px solid #f0ebe4;
    align-items: center;
  }
  .report-row:last-child { border-bottom: none; }
  .report-key { color: var(--muted); }
  .report-val { font-weight: 700; }
  .profit-positive { color: var(--green); font-size: 18px; font-weight: 900; }
  .profit-negative { color: var(--red); font-size: 18px; font-weight: 900; }

  /* ── CHART BAR ── */
  .bar-wrap { padding: 14px 16px; }
  .bar-row { margin-bottom: 10px; }
  .bar-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .bar-track { background: #f0ebe4; border-radius: 4px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--red); transition: width .6s ease; }
  .bar-fill.green { background: var(--green); }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 30px 20px; color: var(--muted); }
  .empty-icon { font-size: 36px; margin-bottom: 8px; }
  .empty-text { font-size: 13px; }

  /* ── PENDING BADGE ── */
  .pending-dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--warn);
    border-radius: 50%;
    margin-left: 4px;
    vertical-align: middle;
  }

  .mode-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .mode-btn {
    flex: 1;
    padding: 9px 4px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: white;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
    transition: all .2s;
  }

  .staff-chip {
    padding: 8px 14px;
    border-radius: 20px;
    border: 2px solid var(--border);
    background: white;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    color: var(--ink);
    transition: all .15s;
  }
  .staff-chip.selected {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }
  .staff-list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 700;
  }
  .btn-remove-staff {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
  }
  .mode-btn.active { border-color: var(--red); background: var(--red-light); color: var(--red); }

  .divider-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: .5px;
    padding: 8px 16px 4px;
    background: #f9f6f1;
    border-bottom: 1px solid var(--border);
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">🥟 萊萊蔥抓餅</div>
    <div class="header-sub">每日營運記錄系統</div>
  </div>
  <div style="text-align:right">
    <div class="header-date" id="headerDate"></div>
    <div id="sync-status" style="font-size:11px;opacity:0;transition:opacity .5s;margin-top:2px"></div>
    <button onclick="syncFromSheets()" style="background:rgba(255,255,255,.2);border:none;color:white;font-size:11px;padding:3px 8px;border-radius:4px;cursor:pointer;font-family:inherit;margin-top:3px">⟳ 同步</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('expense')">💰 支出</div>
  <div class="tab" onclick="switchTab('performance')">📊 戰績</div>
  <div class="tab" onclick="switchTab('staff')">👥 人員</div>
  <div class="tab" onclick="switchTab('report')">報表</div>
  <div class="tab" onclick="switchTab('search')">🔍 搜尋</div>
</div>

<!-- ═══════════ 支出 TAB ═══════════ -->
<div class="section active" id="tab-expense">

  <div class="date-bar">
    <label>日期</label>
    <input type="date" id="expenseDate">
    <button class="btn-load" onclick="loadDay()">載入</button>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" id="mode-view" onclick="setMode('view')">📋 查看</button>
    <button class="mode-btn" id="mode-add" onclick="setMode('add')">➕ 新增</button>
  </div>

  <div id="expenseList"></div>
  <div id="addExpenseArea" style="display:none">
    <button class="add-btn" onclick="openModal('expense')">＋ 新增支出項目</button>
  </div>
</div>

<!-- ═══════════ 戰績 TAB ═══════════ -->
<div class="section" id="tab-performance">
  <div class="date-bar">
    <label>日期</label>
    <input type="date" id="perfDate">
    <button class="btn-load" onclick="loadPerfDay()">載入</button>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" id="perfmode-view" onclick="setPerfMode('view')">📋 查看</button>
    <button class="mode-btn" id="perfmode-add" onclick="setPerfMode('add')">➕ 新增</button>
  </div>

  <div id="perfDisplay"></div>
  <div id="addPerfArea" style="display:none">
    <button class="add-btn" onclick="openModal('perf')">＋ 填寫當日戰績</button>
  </div>
</div>

<!-- ═══════════ 人員 TAB ═══════════ -->
<div class="section" id="tab-staff">
  <div class="date-bar">
    <label>日期</label>
    <input type="date" id="staffDate">
    <button class="btn-load" onclick="loadStaffDay()">載入</button>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" id="staffmode-view" onclick="setStaffMode('view')">📋 查看</button>
    <button class="mode-btn" id="staffmode-add" onclick="setStaffMode('add')">➕ 新增</button>
  </div>

  <div id="staffDisplay"></div>
  <div id="addStaffArea" style="display:none">
    <button class="add-btn" onclick="openModal('staff')">＋ 新增出勤記錄</button>
  </div>
</div>

<!-- ═══════════ 報表 TAB ═══════════ -->
<div class="section" id="tab-report">
  <div class="date-bar">
    <label>月份</label>
    <input type="month" id="reportMonth">
    <button class="btn-load" onclick="generateReport()">產生</button>
  </div>
  <div id="reportContent"></div>
</div>

<!-- ═══════════ MODALS ═══════════ -->

<!-- Expense Modal -->
<div class="modal-overlay" id="modal-expense">
  <div class="modal">
    <div class="modal-title">
      新增支出
      <span class="modal-close" onclick="closeModal('expense')">✕</span>
    </div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input type="date" class="form-input" id="exp-date">
    </div>
    <div class="form-group">
      <label class="form-label">類別</label>
      <select class="form-select" id="exp-cat">
        <option>食材原料</option>
        <option>包裝耗材</option>
        <option>飲品原料</option>
        <option>店面管銷成本</option>
        <option>其他</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">品項名稱</label>
      <input type="text" class="form-input" id="exp-name" placeholder="例：雞蛋">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">金額（元）</label>
        <input type="number" class="form-input" id="exp-amount" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">數量/備註</label>
        <input type="text" class="form-input" id="exp-qty" placeholder="例：2箱">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">⛔️ 漲價備註（選填）</label>
      <input type="text" class="form-input" id="exp-warn" placeholder="例：漲60元/箱">
    </div>
    <div class="form-group">
      <label class="form-label">提交人</label>
      <input type="text" class="form-input" id="exp-who" placeholder="你的名字">
    </div>
    <button class="btn-submit" onclick="submitExpense()">＋ 新增支出</button>
  </div>
</div>

<!-- Perf Modal -->
<div class="modal-overlay" id="modal-perf">
  <div class="modal">
    <div class="modal-title">
      填寫戰績
      <span class="modal-close" onclick="closeModal('perf')">✕</span>
    </div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input type="date" class="form-input" id="perf-date">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">蔥抓餅（顆）</label>
        <input type="number" step="1" class="form-input" id="perf-scallion" placeholder="例：150">
      </div>
      <div class="form-group">
        <label class="form-label">小籠包（籠）</label>
        <input type="number" class="form-input" id="perf-dumpling" placeholder="0">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">進貨支出（元）</label>
        <input type="number" class="form-input" id="perf-purchase" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">其他支出（元）</label>
        <input type="number" class="form-input" id="perf-other" placeholder="0">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">營業額（元）</label>
      <input type="number" class="form-input" id="perf-revenue" placeholder="0">
    </div>
    <div class="form-group">
      <label class="form-label">備註</label>
      <input type="text" class="form-input" id="perf-note" placeholder="特殊情況...">
    </div>
    <div class="form-group">
      <label class="form-label">提交人</label>
      <input type="text" class="form-input" id="perf-who" placeholder="你的名字">
    </div>
    <button class="btn-submit" onclick="submitPerf()">＋ 儲存戰績</button>
  </div>
</div>

<!-- Staff Modal -->
<div class="modal-overlay" id="modal-staff">
  <div class="modal">
    <div class="modal-title">
      新增出勤
      <span class="modal-close" onclick="closeModal('staff')">✕</span>
    </div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input type="date" class="form-input" id="staff-date">
    </div>
    <div class="form-group">
      <label class="form-label" style="display:flex;justify-content:space-between;align-items:center">
        姓名
        <span onclick="openManageStaff()" style="color:var(--red);font-size:11px;cursor:pointer;font-weight:700">⚙️ 管理名單</span>
      </label>

const API_URL = 'https://script.google.com/macros/s/AKfycbx4VDzrLNQSid3m-QwYX8H_ILQ1uTTwhwKnlxxrEAA5UW-495o6x2vO9nvsSEDHbXP9SQ/exec';
let isSyncing = false;

function showSyncStatus(msg, color='var(--orange)') {
  let el = document.getElementById('sync-status');
  if (!el) return;
  el.textContent = msg;
  el.style.color = color;
  el.style.opacity = '1';
  if (color !== 'var(--orange)') {
    setTimeout(() => { el.style.opacity = '0'; }, 2500);
  }
}

let syncLock = false;

async function syncFromSheets() {
  if (syncLock) return;
  showSyncStatus('⟳ 同步中...');
  try {
    const res = await fetch(API_URL + '?action=getAll');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    DB.expenses = (data.expenses || []).map(e => ({ ...e, status: e.status || 'approved' }));
    DB.performances = (data.performances || []).map(p => ({ ...p, status: p.status || 'approved' }));
    DB.staff = (data.staff || []).map(s => ({ ...s }));
    localStorage.setItem('lailaiDB', JSON.stringify(DB));
    showSyncStatus('✓ 已同步', 'var(--green)');
    renderExpenses();
    renderPerf();
    renderStaff();
    generateReport();
    // 如果目前在報表 Tab 就刷新
    if (document.getElementById('tab-report').classList.contains('active')) {
      document.getElementById('reportMonth').value = (expenseCurrentDate||today()).slice(0,7);
      generateReport();
    }
  } catch(e) {
    showSyncStatus('✗ 同步失敗', 'var(--red)');
    console.error(e);
  }
}

async function pushToSheets(sheetName, rowData) {
  syncLock = true;
  try {
    const url = API_URL + '?action=add&sheet=' + sheetName + '&data=' + encodeURIComponent(JSON.stringify(rowData));
    const res = await fetch(url);
    const result = await res.json();
    if (result.error) throw new Error(result.error);
    showSyncStatus('✓ 已儲存', 'var(--green)');
    setTimeout(() => { syncLock = false; }, 3000);
    return true;
  } catch(e) {
    showSyncStatus('✗ 儲存失敗', 'var(--red)');
    syncLock = false;
    console.error(e);
    return false;
  }
}

async function deleteFromSheets(sheetName, id) {
  try {
    const url = API_URL + '?action=delete&sheet=' + sheetName + '&id=' + id;
    const res = await fetch(url);
    const result = await res.json();
    return result.success;
  } catch(e) {
    console.error(e);
    return false;
  }
}

function today() {
  return new Date().toISOString().slice(0,10);
}

function fmt(n) {
  return Number(n).toLocaleString();
}

function calcHours(inT, outT) {
  if (!inT || !outT) return 0;
  const [ih,im] = inT.split(':').map(Number);
  const [oh,om] = outT.split(':').map(Number);
  return ((oh*60+om) - (ih*60+im)) / 60;
}

function renderExpenses() {
  const date = expenseCurrentDate;
  const items = DB.expenses.filter(e => e.date === date && (e.status === 'approved' || !e.status));

  const cats = {};
  items.forEach(item => {
    if (!cats[item.cat]) cats[item.cat] = [];
    cats[item.cat].push(item);
  });

  let html = '';
  let total = 0;

  if (items.length === 0) {
    html = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">這天還沒有支出記錄</div></div>`;
  }

  Object.keys(cats).forEach(cat => {
    html += `<div class="card">
      <div class="card-header ${cat==='店面管銷成本'?'mgmt':cat==='食材原料'?'red':cat==='包裝耗材'?'gold':cat==='飲品原料'?'green':'orange'}">${cat==='食材原料'?'🥩':cat==='包裝耗材'?'📦':cat==='飲品原料'?'🧋':cat==='店面管銷成本'?'🏪':'📋'} ${cat}</div>
      <table class="expense-table">
        <tr><th>品項</th><th>數量</th><th style="text-align:right">金額</th><th></th></tr>`;
    cats[cat].forEach(item => {
      total += Number(item.amount);
      html += `<tr>
        <td>${item.name}${item.warn ? `<span class="warn-badge">⛔️漲</span><span class="note">${item.warn}</span>` : ''}</td>
        <td style="color:var(--muted);font-size:12px">${item.qty||'-'}</td>

    html += `</table></div>`;

    html += `<div class="card"><table class="expense-table">
      <tr class="total-row"><td colspan="2">💰 當日支出總計</td><td class="amt">$${fmt(total)}</td></tr>

// ══════════════════════════════
// REPORT
// ══════════════════════════════
function generateReport() {
  const el = document.getElementById('reportContent');
  if (!el) return;
  const month = document.getElementById('reportMonth').value || today().slice(0,7);
  const [yr, mo] = month.split('-').map(Number);

  const expenses = DB.expenses.filter(e => e.date && e.date.startsWith(month) && (e.status==='approved' || !e.status));
  const perfs = DB.performances.filter(p => p.date && p.date.startsWith(month) && (p.status==='approved' || !p.status));
  const staff = DB.staff.filter(s => s.date.startsWith(month));

  const totalExpense = expenses.reduce((s,e) => s+Number(e.amount), 0);
  const totalRevenue = perfs.reduce((s,p) => s+Number(p.revenue), 0);
  const totalHours = staff.reduce((s,r) => s+calcHours(r.in,r.out), 0);
  const totalWageReport = totalHours * HOURLY_RATE;
  const totalAllExpense = totalExpense + totalWageReport;
  const totalProfit = totalRevenue - totalAllExpense;
  const scallionTotal = perfs.reduce((s,p) => s+Number(p.scallion||0), 0);
  const dumplingTotal = perfs.reduce((s,p) => s+Number(p.dumpling||0), 0);

  // Category breakdown
  const catBreakdown = {};
  expenses.forEach(e => {
    catBreakdown[e.cat] = (catBreakdown[e.cat]||0) + Number(e.amount);
  });
  if (totalWageReport > 0) catBreakdown['💵 員工薪資'] = totalWageReport;

  // Price warnings
  const warns = expenses.filter(e => e.warn);

  // Staff hours
  const staffHours = {};
  staff.forEach(s => {
    const h = calcHours(s.in, s.out);
    staffHours[s.name] = (staffHours[s.name]||0) + h;
  });
  const topStaff = Object.entries(staffHours).filter(([n,h]) => h > 0).sort((a,b) => b[1]-a[1]);

  let html = `
  <div class="report-card">
    <div class="report-header"><span>${yr}年${mo}月 月報</span><span>${perfs.length}天</span></div>
    <div class="report-row"><span class="report-key">📈 總營業額</span><span class="report-val" style="color:var(--green)">$${fmt(totalRevenue)}</span></div>
    <div class="report-row"><span class="report-key">📦 進貨＋管銷支出</span><span class="report-val" style="color:var(--muted)">$${fmt(totalExpense)}</span></div>
    <div class="report-row"><span class="report-key">💵 員工薪資</span><span class="report-val" style="color:var(--muted)">$${fmt(totalWageReport)}</span></div>
    <div class="report-row" style="background:#f9f6f1"><span class="report-key" style="font-weight:900">💸 總支出合計</span><span class="report-val" style="color:var(--red)">$${fmt(totalAllExpense)}</span></div>
    <div class="report-row"><span class="report-key">💰 預估毛利</span>
      <span class="report-val ${totalProfit>=0?'profit-positive':'profit-negative'}">${totalProfit>=0?'+':''}$${fmt(totalProfit)}</span>
    </div>
    <div class="report-row"><span class="report-key">📊 毛利率</span><span class="report-val">${totalRevenue>0?((totalProfit/totalRevenue)*100).toFixed(1):0}%</span></div>
  </div>

  <div class="report-card">
    <div class="report-header">🏆 銷售統計</div>
    <div class="report-row"><span class="report-key">🧅 蔥抓餅合計</span><span class="report-val">${fmt(scallionTotal)} 顆</span></div>
    <div class="report-row"><span class="report-key">🥟 小籠包合計</span><span class="report-val">${fmt(dumplingTotal)} 籠</span></div>
    <div class="report-row"><span class="report-key">📅 營業天數</span><span class="report-val">${perfs.length} 天</span></div>
  </div>

  <div class="report-card">
    <div class="report-header">📦 支出分類</div>
    <div class="bar-wrap">
      ${Object.entries(catBreakdown).sort((a,b)=>b[1]-a[1]).map(([cat,amt]) => `
      <div class="bar-row">
        <div class="bar-label"><span>${cat}</span><span>$${fmt(amt)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${totalAllExpense>0?(amt/totalAllExpense*100).toFixed(0):0}%"></div></div>
      </div>`).join('')}
    </div>
  </div>

  ${warns.length > 0 ? `
  <div class="report-card">
    <div class="report-header" style="background:var(--warn)">⛔️ 本月漲價項目（${warns.length}筆）</div>
    ${warns.map(w => `
    <div class="report-row">
      <span class="report-key">${w.name}</span>
      <span class="report-val" style="color:var(--warn);font-size:12px">${w.warn}</span>
    </div>`).join('')}
  </div>` : ''}

  <div class="report-card">
    <div class="report-header">👥 員工工時排行<span style="font-size:11px;font-weight:400;opacity:.7;margin-left:8px">${Object.keys(staffHours).length}人</span></div>
    ${topStaff.length > 0 ? topStaff.map(([name,h]) => `
    <div class="report-row">
      <span class="report-key" style="font-weight:700">${name}</span>
      <span style="text-align:right">
        <span class="hours-badge">${h.toFixed(1)}h</span>
        <span style="font-weight:900;color:var(--red);margin-left:6px">$${fmt(h * HOURLY_RATE)}</span>
      </span>
    </div>`).join('') : `<div class="empty"><div class="empty-text">尚無出勤工時資料</div></div>`}
    ${totalHours > 0 ? `<div class="report-row" style="background:var(--red-light)">
      <span class="report-key" style="font-weight:900">月薪資合計<br><span style="font-size:11px;color:#aaa">${totalHours.toFixed(1)} 小時</span></span>
      <span style="font-size:18px;font-weight:900;color:var(--red)">$${fmt(totalHours * HOURLY_RATE)}</span>
    </div>` : ''}
  </div>
  `;

  document.getElementById('reportContent').innerHTML = html;
}

// ══════════════════════════════
// SEARCH
// ══════════════════════════════
function runSearch() {
  const kw = document.getElementById('search-keyword').value.trim().toLowerCase();
  const cat = document.getElementById('search-cat').value;
  const dateFrom = document.getElementById('search-date-from').value;
  const dateTo = document.getElementById('search-date-to').value;

  let results = DB.expenses.filter(e => {
    const matchKw = !kw || e.name.toLowerCase().includes(kw);
    const matchCat = !cat || e.cat === cat;
    const matchFrom = !dateFrom || e.date >= dateFrom;
    const matchTo = !dateTo || e.date <= dateTo;
    return matchKw && matchCat && matchFrom && matchTo;
  });

  // 依日期新到舊排序
  results.sort((a,b) => b.date.localeCompare(a.date));

  const summary = document.getElementById('search-summary');
  const container = document.getElementById('search-results');

  if (results.length === 0) {
    summary.innerHTML = '';
    container.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">找不到符合的項目</div></div>`;
    return;
  }

  // 統計
  const totalAmt = results.reduce((s,e) => s+Number(e.amount), 0);
  const avgAmt = totalAmt / results.length;
  const minItem = results.reduce((a,b) => Number(a.amount)<Number(b.amount)?a:b);
  const maxItem = results.reduce((a,b) => Number(a.amount)>Number(b.amount)?a:b);

  summary.innerHTML = `
    <div class="card">
      <div class="card-header red">📊 搜尋結果統計（${results.length} 筆）</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0">
        <div style="padding:12px 16px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)">
          <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">最低價</div>
          <div style="font-size:16px;font-weight:900;color:var(--green)">$${fmt(minItem.amount)}</div>
          <div style="font-size:11px;color:var(--muted)">${minItem.date}</div>
        </div>
        <div style="padding:12px 16px;border-bottom:1px solid var(--border)">
          <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">最高價</div>
          <div style="font-size:16px;font-weight:900;color:var(--red)">$${fmt(maxItem.amount)}</div>
          <div style="font-size:11px;color:var(--muted)">${maxItem.date}</div>
        </div>
        <div style="padding:12px 16px;border-right:1px solid var(--border)">
          <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">平均價</div>
          <div style="font-size:16px;font-weight:900">$${fmt(Math.round(avgAmt))}</div>
        </div>
        <div style="padding:12px 16px">
          <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">合計</div>
          <div style="font-size:16px;font-weight:900">$${fmt(totalAmt)}</div>
        </div>
      </div>
    </div>`;

  // 明細列表
  let html = '<div class="card"><div class="card-header gold">📋 明細（新→舊）</div><table class="expense-table"><tr><th>日期</th><th>品項</th><th>數量</th><th style="text-align:right">金額</th></tr>';
  results.forEach(e => {
    html += `<tr>
      <td style="font-size:12px;color:var(--muted);white-space:nowrap">${e.date}</td>
      <td>
        ${e.name}
        ${e.warn ? `<span class="warn-badge">⛔️漲</span>` : ''}
        <span style="font-size:10px;color:var(--muted);display:block">${e.cat}</span>
      </td>
      <td style="font-size:12px;color:var(--muted)">${e.qty||'-'}</td>
      <td class="amt">$${fmt(e.amount)}</td>
    </tr>`;
  });
  html += '</table></div>';
  container.innerHTML = html;
}



// ══════════════════════════════
// TOUCH & DEBOUNCE
// ══════════════════════════════
function debounce(fn, delay=600) {
  let timer;
  return function(...args) {
    if (timer) return;
    fn.apply(this, args);
    timer = setTimeout(() => { timer = null; }, delay);
  };
}

// 包裝 submit 函數防止重複點擊
function wrapButtons() {
  document.querySelectorAll('.btn-submit, .btn-load, .add-btn').forEach(btn => {
    const orig = btn.onclick;
    if (orig && !btn._wrapped) {
      btn._wrapped = true;
      btn.addEventListener('touchend', function(e) {
        e.preventDefault();
        btn.click();
      }, { passive: false });
    }
  });
}

// ══════════════════════════════
// STAFF MEMBER LIST
// ══════════════════════════════
const DEFAULT_STAFF = ['蔡老闆','馮老闆','賢','文玲','淑儀','聖韻','睿恩','偉翰','小玉'];

function getStaffList() {
  return JSON.parse(localStorage.getItem('lailaiStaffList') || JSON.stringify(DEFAULT_STAFF));
}

function saveStaffList(list) {
  localStorage.setItem('lailaiStaffList', JSON.stringify(list));
}

function renderStaffPicker() {
  const list = getStaffList();
  const picker = document.getElementById('staff-picker');
  if (!picker) return;
  picker.innerHTML = list.map(name =>
    `<button class="staff-chip" onclick="selectStaffChip(this, '${name}')">${name}</button>`
  ).join('');
  document.getElementById('staff-name').value = '';
  document.getElementById('staff-selected-display').textContent = '';
}

function selectStaffChip(el, name) {
  document.querySelectorAll('.staff-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('staff-name').value = name;
  document.getElementById('staff-selected-display').textContent = '已選：' + name;
}

function openManageStaff() {
  renderStaffListEdit();
  document.getElementById('modal-manage-staff').classList.add('open');
}

function renderStaffListEdit() {
  const list = getStaffList();
  document.getElementById('staff-list-edit').innerHTML = list.map((name, i) =>
    `<div class="staff-list-item">
      <span>${name}</span>
      <button class="btn-remove-staff" onclick="removeStaffMember(${i})">✕</button>
    </div>`
  ).join('');
}

function addStaffMember() {
  const input = document.getElementById('new-staff-input');
  const name = input.value.trim();
  if (!name) return;
  const list = getStaffList();
  if (list.includes(name)) { alert('已有此名字'); return; }
  list.push(name);
  saveStaffList(list);
  input.value = '';
  renderStaffListEdit();
  renderStaffPicker();
}

function removeStaffMember(idx) {
  const list = getStaffList();
  list.splice(idx, 1);
  saveStaffList(list);
  renderStaffListEdit();
  renderStaffPicker();
}
